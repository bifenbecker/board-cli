name: Request title

# Apart from CI so a title fixed by hand is checked again without rerunning the tests: the title
# becomes the squash commit on main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # The name the ruleset requires.
  commit-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pipx install commit-check==2.15.1
          printf '%s\n' "$TITLE" | commit-check --message
