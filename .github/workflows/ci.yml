name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just
      - name: Install shellcheck and dash
        run: sudo apt-get install -y --no-install-recommends shellcheck dash jq
      - name: Lint
        run: just lint

  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pipx install commit-check==2.15.1
          printf '%s\n' "$TITLE" | commit-check --message

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install jq on Windows
        if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - name: Tests
        run: sh tests/run.sh

  test-alpine:
    runs-on: ubuntu-latest
    container: alpine:3.22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: apk add --no-cache jq curl
      - name: Probe jq
        run: |
          jq --version
          try() { echo "--- $1"; jq -n -L lib "$1" 2>&1 | tail -1; }
          try 'include "github/shape"; 1'
          try 'include "github/shape"; {login: "a"} | gh_user'
          try 'include "github/shape"; "a" | gh_priority({})'
          try 'include "github/shape"; {user: null} | gh_comment'
          try 'include "github/shape"; {} | gh_label'
          try 'include "jq/common"; {} | make_comment'
          try 'include "jq/common"; {} | make_label'
          try 'include "jq/common"; include "github/shape"; {} | gh_label'
          try 'import "github/shape" as s; {} | s::gh_label'
          try 'include "jq/common"; {id: 1, name: "a"} | {id, name}'
          try 'def a: {x: 1}; def b: {y} | a; {} | b'
          try 'include "jq/common"; {a: 1} | {a} | make_label'
      - name: Tests under busybox
        run: sh tests/run.sh
