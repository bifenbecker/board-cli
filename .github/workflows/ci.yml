name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - name: Install shellcheck and dash
        run: sudo apt-get install -y --no-install-recommends shellcheck dash jq
      - name: Lint
        run: just lint

  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pipx install commit-check==2.15.1
          printf '%s\n' "$TITLE" | commit-check --message

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install jq on Windows
        if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
      - name: Tests
        run: sh tests/run.sh

  test-alpine:
    runs-on: ubuntu-latest
    container: alpine:3.22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: apk add --no-cache jq curl
      - name: Tests under busybox
        run: sh tests/run.sh
