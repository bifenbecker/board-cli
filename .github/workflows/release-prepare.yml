# Run from the Actions tab on main: bumps the version, regenerates the changelog and opens the
# release request. Merging that request publishes the release (release.yml).
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release, e.g. v0.2.0 (default: worked out from the commits)"
        required: false
        type: string

permissions: {}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # A token other than GITHUB_TOKEN: a request opened with GITHUB_TOKEN runs no CI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: just,git-cliff
      # forge runs with the release token: pinned by commit, never fetched by a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bifenbecker/forge-cli
          ref: 57ae94f3a38a4c4a6b5c9b6432f2b6975e1c38eb # v0.2.0
          path: .forge
          persist-credentials: false
      - name: Install forge
        run: |
          sh .forge/install.sh --from .forge
          rm -rf .forge
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
      - name: Identify the committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Prepare
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: just release ${INPUT_VERSION:+VERSION=$INPUT_VERSION}
