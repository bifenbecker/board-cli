# Actions are pinned to commit SHAs; Dependabot moves the pins and the version comments together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # The group's name ends the request title: a short one keeps it within the 72 of a subject.
    groups:
      ci:
        patterns: ["*"]
