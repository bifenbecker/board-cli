query ItemView($id: ID!, $priorityField: String!, $dueField: String!, $sprintField: String!) {
  node(id: $id) {
    ... on ProjectV2Item {
      ...ItemFields
      project { id number }
      content {
        __typename
        ... on Issue { ...IssueFields }
        ... on DraftIssue { id title body createdAt updatedAt creator { login } assignees(first: 20) { nodes { login name } } }
        ... on PullRequest { id number title body url state createdAt updatedAt repository { nameWithOwner } author { login } assignees(first: 20) { nodes { login name } } labels(first: 50) { nodes { name } } milestone { title } }
      }
    }
  }
}
