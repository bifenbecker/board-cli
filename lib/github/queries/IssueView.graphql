query IssueView($owner: String!, $name: String!, $number: Int!, $priorityField: String!, $dueField: String!, $sprintField: String!) {
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      ...IssueFields
      projectItems(first: 20, includeArchived: true) {
        nodes {
          ...ItemFields
          project { id number owner { ... on User { login } ... on Organization { login } } }
        }
      }
    }
  }
}
